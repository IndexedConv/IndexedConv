# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  release:
    types: [published]

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Build package
      run: python -m build
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@27b31702a0e7fc50959f5ad993c78deac1bdfc29
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}

  update-codemeta:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v2
      with:
        ref: master
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Update codemeta.json
      env:
        TAG: ${{ github.ref_name }}
        RELEASE_DATE: ${{ github.event.release.published_at }}
      run: |
        python - <<'EOF'
        import json, os
        tag = os.environ['TAG']
        version = tag.lstrip('v')
        date = os.environ['RELEASE_DATE'][:10]
        with open('codemeta.json', 'r') as f:
            data = json.load(f)
        data['version'] = version
        data['softwareVersion'] = version
        data['dateModified'] = date
        data['downloadUrl'] = f'https://github.com/IndexedConv/IndexedConv/archive/refs/tags/{tag}.zip'
        with open('codemeta.json', 'w') as f:
            json.dump(data, f, indent=4)
            f.write('\n')
        EOF
    - name: Commit and push codemeta.json
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add codemeta.json
        git diff --staged --quiet || git commit -m "Update codemeta.json for release ${{ github.ref_name }}"
        git push
